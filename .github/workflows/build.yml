name: Build Zen Browser RPM
run-name: Build Zen ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Zen Browser release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zen-rpm-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    name: Build Fedora ${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          docker image prune -af
          df -h

      - name: Compile Zen Browser
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p out

          docker run --rm \
            -e VERSION \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/workspace" \
            registry.fedoraproject.org/fedora:${{ matrix.fedora }} \
            bash /workspace/build.sh

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: zen-browser-rpm-fc${{ matrix.fedora }}
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
