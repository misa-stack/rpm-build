name: Check for Zen releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [zen-release]
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-release.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: zen-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check upstream and dispatch if necessary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: https://misa-stack.github.io/rpm-build
        shell: bash
        run: |
          set -euo pipefail

          tag=$(gh api repos/zen-browser/desktop/releases/latest |
            jq -er 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$tag" =~ ^[0-9]+(\.[0-9]+){1,3}b?$ ]] || {
            echo "Unsupported upstream tag: $tag" >&2
            exit 1
          }
          echo "Latest upstream release: $tag"

          # A missing file is different from an unavailable network.
          fetch() {
            local code
            code=$(curl -sS -L --retry 3 --max-time 60 \
              -H 'Cache-Control: no-cache' -o "$2" -w '%{http_code}' "$1") || return 2
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "HTTP $code for $1" >&2; return 2 ;;
            esac
          }

          current=""
          if fetch "$BASE/version.txt" /tmp/zen-version.txt; then
            current=$(tr -d '\r\n' </tmp/zen-version.txt)
            [[ "$current" =~ ^[0-9]+(\.[0-9]+){1,3}b?$ ]] || {
              echo "Invalid published version marker" >&2
              exit 1
            }
          else
            rc=$?
            [[ "$rc" == 1 ]] || exit "$rc"
            echo "No published version marker yet."
          fi

          complete=true
          for release in 44 45; do
            if fetch "$BASE/$release/x86_64/repodata/repomd.xml" /tmp/repomd.xml; then
              grep -q '<repomd' /tmp/repomd.xml || {
                echo "Invalid Fedora $release repository metadata" >&2
                exit 1
              }
            else
              rc=$?
              [[ "$rc" == 1 ]] || exit "$rc"
              complete=false
            fi
          done

          if [[ "$current" == "$tag" && "$complete" == true ]]; then
            echo "Both repositories are already up to date."
            exit 0
          fi

          builds=$(gh run list -R "$REPO" --workflow build.yml --branch main \
            --limit 30 --json databaseId,displayTitle,status,conclusion,createdAt)
          publishes=$(gh run list -R "$REPO" --workflow publish.yml --branch main \
            --limit 30 --json databaseId,displayTitle,status,conclusion,createdAt)

          if jq -e 'any(.[]; .status != "completed")' <<<"$builds" >/dev/null ||
             jq -e 'any(.[]; .status != "completed")' <<<"$publishes" >/dev/null; then
            echo "A build or publish is already active."
            exit 0
          fi

          latest=$(jq -c --arg title "Build Zen $tag" \
            '[.[] | select(.displayTitle == $title)] | sort_by(.createdAt) | last // empty' <<<"$builds")

          # Retry publishing existing successful artifacts instead of rebuilding.
          if [[ -n "$latest" ]]; then
            run_id=$(jq -r '.databaseId' <<<"$latest")
            result=$(jq -r '.conclusion' <<<"$latest")
            created=$(jq -r '.createdAt' <<<"$latest")
            age=$(( $(date +%s) - $(date -d "$created" +%s) ))

            if [[ "$result" == success ]]; then
              artifacts=$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100")
              if jq -e '
                [.artifacts[] | select(.expired == false) | .name] |
                (index("zen-browser-rpm-fc44") != null and index("zen-browser-rpm-fc45") != null)
              ' <<<"$artifacts" >/dev/null; then
                previous=$(jq -r --arg title "Publish build $run_id" \
                  '[.[] | select(.displayTitle == $title)] | sort_by(.createdAt) | last | .createdAt // empty' <<<"$publishes")
                if [[ -n "$previous" ]] &&
                   (( $(date +%s) - $(date -d "$previous" +%s) < 21600 )); then
                  echo "A publish was attempted recently; retry after six hours."
                  exit 0
                fi
                gh workflow run publish.yml -R "$REPO" --ref main -f "run_id=$run_id"
                echo "Requested publication of build $run_id."
                exit 0
              fi
            elif (( age < 21600 )); then
              echo "Previous build failed or was cancelled; retry after six hours."
              exit 0
            fi
          fi

          gh workflow run build.yml -R "$REPO" --ref main -f "version=$tag"
          echo "Requested build of $tag."
